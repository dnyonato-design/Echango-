<style>
/* Mise en page : une colonne mobile (480px max) avec en-tête, zone défilante, barre d'action puis onglets. Vert et bleu, comme le logo. */
:root{
  --out:#E4EAE7; --bg:#F5F7F6; --surface:#FFFFFF; --ink:#12261E; --muted:#5A6B62; --line:#DAE2DD;
  --brand:#107828; --brand-ink:#FFFFFF; --sun:#0052AD; --sun-ink:#FFFFFF; --danger:#B3261E;
  --tile-v:#D6E4F7; --tile-e:#D5EFD2; --tile-s:#D2ECEF; --tile-o:#E2E9E5; --dot:rgba(18,38,30,.10);
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --out:#080C0A; --bg:#0D1411; --surface:#16201B; --ink:#E8F1EC; --muted:#93A59B; --line:#2A3731;
  --brand:#4CC25A; --brand-ink:#04140D; --danger:#FF8A80;
  --tile-v:#17305A; --tile-e:#173F1E; --tile-s:#12394A; --tile-o:#222E28; --sun:#6EA8FF; --sun-ink:#06142B; --dot:rgba(255,255,255,.08); color-scheme:dark}}
:root[data-theme="dark"]{
  --out:#080C0A; --bg:#0D1411; --surface:#16201B; --ink:#E8F1EC; --muted:#93A59B; --line:#2A3731;
  --brand:#4CC25A; --brand-ink:#04140D; --danger:#FF8A80;
  --tile-v:#17305A; --tile-e:#173F1E; --tile-s:#12394A; --tile-o:#222E28; --sun:#6EA8FF; --sun-ink:#06142B; --dot:rgba(255,255,255,.08); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--out);color:var(--ink);font:16px/1.45 'Figtree',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo{font-family:var(--display);text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:relative;height:100%;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;border-inline:1px solid var(--line);overflow:hidden}
#top,#bottom{flex:none}
#main{flex:1;min-height:0;overflow-y:auto;padding:16px;overscroll-behavior:contain}

.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);min-height:64px}
.bar h2{font-size:19px;font-weight:800;flex:1;min-width:0}
.bar .grow{flex:1;min-width:0}
.logo{font-size:22px;font-weight:800;letter-spacing:-.01em;display:block;line-height:1.1}
.logo .w1{color:var(--sun)} .logo .w2{color:var(--brand)}
.loc{display:block;font-size:12px;color:var(--muted)}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.iconbtn:active{background:var(--line)}
.mark{flex:none;display:block}

.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--muted)}
.search:focus-within{outline:2px solid var(--brand)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.srow{display:flex;gap:8px;align-items:center}.srow .search{flex:1;min-width:0}
.fbtn{position:relative;flex:none;width:48px;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);display:grid;place-items:center}
.fbtn[aria-expanded="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.fc{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--sun);color:var(--sun-ink);font-size:12px;font-weight:800;display:grid;place-items:center}.fc[hidden]{display:none}
.fpanel{margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.fpanel .seg{margin-bottom:0}
.prange{display:flex;gap:8px;align-items:center}.prange input,.finp{width:100%!important;flex:1;width:0;min-width:0;box-sizing:border-box;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font:inherit;color:var(--ink)}
.cnt{font-size:13px;margin:0 0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.sellcta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:16px;background:var(--tile-v);margin-bottom:12px;flex-wrap:wrap}
.sellcta>div{display:grid;gap:2px;min-width:0;flex:1 1 180px}
.sellcta b{font-family:var(--display);font-size:16px}
.sellcta .btn{flex:none;padding:0 22px;height:44px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.card-main{display:flex;flex-direction:column;width:100%;text-align:left}
.tile{display:grid;place-items:center;aspect-ratio:1;max-width:100%;overflow:hidden;background-color:var(--tile);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.5px);background-size:14px 14px;color:var(--ink)}
.tile svg.i{width:44px;height:44px;stroke-width:1.5;opacity:.8}
.t-v{--tile:var(--tile-v)} .t-e{--tile:var(--tile-e)} .t-s{--tile:var(--tile-s)} .t-o{--tile:var(--tile-o)} .t-t{--tile:var(--tile-s)} .t-m{--tile:var(--tile-v)} .t-a{--tile:var(--tile-o)} .t-b{--tile:var(--tile-e)}
.ctl select{flex:1;min-width:0;width:100%;border:0;background:transparent;font:inherit;color:var(--ink);padding:12px;outline:none;height:48px}.finp{appearance:auto}
.tile .ph{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:10px 12px 12px;display:grid;gap:2px}
.name{font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.sub2{display:block;font-size:12px;color:var(--muted)}

.price{font-family:var(--display);font-weight:800;font-size:15px;color:var(--brand);font-variant-numeric:tabular-nums;margin-top:4px}
.price small{font-family:'Figtree',system-ui,sans-serif;font-weight:500;font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;display:grid;gap:12px;justify-items:center}
.empty svg.i{width:40px;height:40px;stroke-width:1.4}
.empty h3{color:var(--ink);font-size:18px}
.empty .btn{flex:none;padding:0 24px}

.hero{border-radius:20px;aspect-ratio:16/10}
.hero svg.i{width:72px;height:72px}
.thumbs{display:flex;gap:8px;margin-top:10px}
.thumbs button{width:56px;height:56px;border-radius:12px;overflow:hidden;border:2px solid transparent}
.thumbs button[aria-pressed="true"]{border-color:var(--brand)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.detail{display:grid;gap:10px;margin-top:16px}
.detail h1{font-size:26px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.detail .price{font-size:24px;margin-top:0}
.detail p{color:var(--muted);overflow-wrap:anywhere;white-space:pre-line}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:var(--surface)}
.facts{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.facts li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.facts svg.i{width:20px;height:20px;color:var(--brand);margin-top:1px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.seller{display:grid;gap:12px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who>div{display:grid;min-width:0}
.who b,.who .muted{overflow-wrap:anywhere}
.av{width:44px;height:44px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.av.big{width:56px;height:56px;font-size:22px}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.avedit{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.avedit .btn{flex:none;height:40px;padding:0 16px;font-size:14px}.vh2{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.num{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;user-select:text}

.actionbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.actionbar.col{flex-direction:column;align-items:stretch;gap:10px}
.btn{flex:1;min-width:0;height:52px;border-radius:14px;padding:0 18px;background:var(--brand);color:var(--brand-ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:var(--brand-ink)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.block{width:100%;flex:none}

.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
.tab{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tab[aria-current="page"]{color:var(--brand);font-weight:600}
.tab.sell{color:var(--ink)}
.tab.sell[aria-current="page"]{color:var(--brand)}
.tab.sell .plusb{width:44px;height:30px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}

.linkbtn{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.rad{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:8px;cursor:pointer}
.rad:has(input:checked){border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.rad input{accent-color:var(--brand);width:20px;height:20px;margin:0;flex:none}
.sec{font-size:15px;font-weight:800;margin:20px 0 10px;font-family:var(--display)}
.sec:first-child{margin-top:0}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label{font-weight:600;font-size:14px}
.ctl{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.ctl:focus-within{outline:2px solid var(--brand)}
.ctl.bad{border-color:var(--danger)}
.ctl .prefix{display:grid;place-items:center;padding:0 12px;background:var(--bg);color:var(--muted);border-right:1px solid var(--line);font-size:14px}
.ctl .suffix{border-right:0;border-left:1px solid var(--line)}
.ctl input,.ctl textarea{flex:1;min-width:0;width:100%;border:0;background:transparent;font:inherit;color:var(--ink);padding:12px;outline:none;resize:none}
.err{color:var(--danger);font-size:14px;margin-bottom:12px}
.ok{color:var(--brand);font-size:14px;margin-bottom:12px;font-weight:500}
.hint{color:var(--muted);font-size:13px}
.muted{color:var(--muted);font-size:13px}
.check{display:flex;align-items:center;gap:10px;margin:-4px 0 14px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--brand);margin:0}

.photos{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pthumb{position:relative;width:76px;height:76px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.pthumb .x svg.i{width:16px;height:16px}
.padd{width:76px;height:76px;border-radius:14px;border:1.5px dashed var(--muted);display:grid;place-items:center;align-content:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

.soldb{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--muted);font-size:11px;font-weight:700;vertical-align:middle}
.soldbar{background:var(--line);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin:0 0 12px}
.sharerow{display:flex;gap:8px;margin:14px 0}.sharerow .btn{flex:1;min-width:0;padding-inline:10px;font-size:14px;text-align:center}
.btn.wa{background:#14803F;color:#fff;border-color:#14803F}
.whobtn{width:100%;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit}
.chev{margin-left:auto;flex:none;font-size:13px;font-weight:600;color:var(--brand)}
.card{position:relative}
.heart{position:absolute;top:8px;right:8px;z-index:2;width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center}
.heart svg.i{width:20px;height:20px;stroke-width:2}
.heart[aria-pressed="true"]{color:var(--danger)}.heart[aria-pressed="true"] svg.i{fill:currentColor}
.trow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.trow .heart{position:static;flex:none}
.legal h2{font-size:21px;font-weight:800;margin:6px 0 4px;font-family:var(--display)}.legal h2:not(:first-child){margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.legal h3{font-size:16px;font-weight:800;margin:20px 0 6px}.legal p{margin:0 0 10px;line-height:1.55}.legal ul{margin:0 0 10px;padding-left:20px;display:grid;gap:6px;line-height:1.5}
.inl{display:inline;padding:0;color:var(--brand);text-decoration:underline;text-underline-offset:3px;font:inherit;text-align:left}
.check.terms{align-items:flex-start;margin:4px 0 16px;font-size:14px;line-height:1.45}.check.terms input{margin-top:1px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{display:grid;gap:2px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.kv{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kl{font-size:13px;color:var(--muted);font-weight:600}.ks{font-size:12px;color:var(--brand);font-weight:700}
.kpi.warn{border-color:var(--danger)}.kpi.warn .kv{color:var(--danger)}
svg.bars{width:100%;height:auto;display:block}svg.bars g{cursor:pointer}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.det summary{font-weight:700;cursor:pointer;min-height:32px}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;font-variant-numeric:tabular-nums}.tbl th,.tbl td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}.tbl th:first-child,.tbl td:first-child{text-align:left}
.catl{list-style:none;margin:0;display:grid;gap:8px}.catl li{display:flex;justify-content:space-between}
.mrow{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow .tile{border-radius:12px}
.mrow .tile svg.i{width:26px;height:26px}
.mi{display:grid;gap:2px;min-width:0}
.mi b{overflow-wrap:anywhere}
.mi .price{margin-top:0}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.seg.two{grid-template-columns:repeat(2,1fr);margin-bottom:16px}
.seg button{height:40px;border-radius:10px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.about{display:grid;gap:8px;justify-items:center;text-align:center}
.confirm{display:grid;gap:10px}
.loading{display:grid;place-items:center;gap:10px;padding:48px 16px;color:var(--muted)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

#toast{position:absolute;left:16px;right:16px;bottom:calc(140px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;text-align:center;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:none}
/* Écran de démarrage : l'étiquette se dessine, puis le nom apparaît. Il disparaît seul après 6 s au plus, même si le script échoue. */
#splash{position:fixed;inset:0;z-index:100;display:grid;justify-items:center;align-content:center;gap:20px;background:var(--bg);transition:opacity .35s ease,visibility .35s;animation:spAuto .01s 6s forwards}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-mark{width:112px;height:112px;overflow:visible;animation:spPop .5s cubic-bezier(.2,.9,.3,1.15) both}
#splash .sp-a{stroke-dasharray:1 1;stroke-dashoffset:1;animation:spDraw .4s .25s ease-out forwards}
#splash .sp-b{stroke-dasharray:1 1;stroke-dashoffset:1;animation:spDraw .3s .55s ease-out forwards}
#splash .sp-dot{transform-box:fill-box;transform-origin:center;animation:spDot .4s .7s cubic-bezier(.2,.9,.3,1.7) both}
#splash .logo{font-size:34px;animation:spUp .5s .35s ease-out both}
#splash .sp-bar{width:96px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;opacity:0;animation:spFade .3s .9s forwards}
#splash .sp-bar::after{content:"";display:block;width:40%;height:100%;border-radius:2px;background:var(--brand);animation:spSlide 1s ease-in-out infinite}
@keyframes spPop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spDot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes spUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spFade{to{opacity:1}}
@keyframes spSlide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes spAuto{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.spin{animation:none}
  #splash{animation:spAuto .01s 6s forwards!important}#splash .sp-a,#splash .sp-b{stroke-dashoffset:0}#splash .sp-bar{opacity:1}#splash .sp-bar::after{width:100%}}
</style>
</head>
<body>
<div id="splash" role="status" aria-label="Chargement d’Échango">
  <svg class="sp-mark" viewBox="0 0 120 120" aria-hidden="true">

  function afterLogin(pending){
    return loadProfile().then(function(){
      if(!S.prof){
        var pe=null;try{pe=JSON.parse(lsGet('ec-pending')||'null');}catch(e){}
        var src=pending||((pe&&S.sess&&pe.email===S.sess.email)?pe:null);
        if(src&&src.name&&digits(src.phone).length===8){
          return rest('POST','/profiles?on_conflict=id',{id:S.sess.uid,name:src.name,phone:digits(src.phone),area:src.area||null},'resolution=merge-duplicates,return=representation').then(function(rows){
            S.prof=rows&&rows[0]||null;S.pf={name:S.prof.name,phone:S.prof.phone,area:S.prof.area||''};
          }).catch(function(){});
        }
      }
    }).then(function(){lsDel('ec-pending');checkAdmin();return loadFavs();});
  }
  function doAuth(){
    if(S.busy)return;
    var f=S.af,up=S.authMode==='signup',email=f.email.trim().toLowerCase(),err='';
    S.authErr='';S.authMsg='';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))err='Entrez une adresse e-mail valide.';
    else if(f.password.length<8)err='Le mot de passe doit avoir au moins 8 caractères.';
    else if(up&&f.name.trim().length<2)err='Entrez votre nom.';
    else if(up&&digits(f.phone).length!==8)err='Le numéro de téléphone doit avoir 8 chiffres.';
    else if(up&&!f.terms)err='Cochez la case pour accepter les conditions d’utilisation.';
    if(err){S.authErr=err;render();return;}
    S.busy=true;render();
    var p;
    if(up){
      p=http(SB+'/auth/v1/signup',{method:'POST',headers:hdr({'Content-Type':'application/json'}),body:JSON.stringify({email:email,password:f.password})}).then(function(d){
        var pend={email:email,name:f.name.trim(),phone:digits(f.phone),area:f.area.trim()};
        if(d&&d.access_token){if(!d.user)return Promise.reject(new Error('x'));setSession(d);return afterLogin(pend).then(function(){return true;});}
        lsSet('ec-pending',JSON.stringify(pend));
        S.authMode='login';S.af.password='';
        S.authMsg='Compte créé. Un e-mail de confirmation vous a été envoyé : ouvrez-le, puis connectez-vous ici.';
        return false;
      });
    }else{
      p=http(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:hdr({'Content-Type':'application/json'}),body:JSON.stringify({email:email,password:f.password})}).then(function(d){
        setSession(d);return afterLogin(null).then(function(){return true;});
      });
    }
    p.then(function(logged){
      S.busy=false;
      if(logged){
        S.af.password='';
        if(S.prof){var to=S.after||'me';S.after=null;afterGate(to);toast('Bienvenue '+S.prof.name.split(' ')[0]+' !');}
        else render();
      }else render();
    }).catch(function(e){S.busy=false;S.authErr=errMsg(e);render();});
  }
  function saveProf(){
    if(S.busy)return;
    var f=S.pf,E={};
    if(f.name.trim().length<2)E.name='Entrez votre nom.';
    if(digits(f.phone).length!==8)E.phone='Le numéro doit avoir 8 chiffres.';
    S.pfErr=E;
    if(Object.keys(E).length){render();focusFirstBad();return;}
    var first=!S.prof,nameChanged=S.prof&&S.prof.name!==f.name.trim();
    S.busy=true;render();
    rest('POST','/profiles?on_conflict=id',{id:S.sess.uid,name:f.name.trim(),phone:digits(f.phone),area:f.area.trim()||null},'resolution=merge-duplicates,return=representation').then(function(rows){
      S.prof=rows&&rows[0]||S.prof;S.pf={name:S.prof.name,phone:S.prof.phone,area:S.prof.area||''};
      if(S.prof.area)lsSet('ec-area',S.prof.area);
      if(nameChanged){return rest('PATCH','/listings?seller_id=eq.'+encodeURIComponent(S.sess.uid),{seller_name:S.prof.name}).catch(function(){});}
    }).then(function(){
      S.busy=false;S.pfErr={};
      if(first&&S.after){var to=S.after;S.after=null;afterGate(to);}else render();
      toast('Profil enregistré');
      loadListings();
    }).catch(function(e){S.busy=false;S.pfErr={phone:errMsg(e)};render();});
  }
  function fileToBlob(f){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(f),im=new Image();
      im.onload=function(){
        URL.revokeObjectURL(url);
        var sc=Math.min(1,1000/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc)),cv=document.createElement('canvas'),q=0.78;
        cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);
        (function t(){cv.toBlob(function(b){if(!b){rej(new Error('blob'));return;}if(b.size>900000&&q>0.4){q-=0.15;t();}else res(b);},'image/jpeg',q);})();
      };

  function fileToAvatar(f){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(f),im=new Image();
      im.onload=function(){
        URL.revokeObjectURL(url);
        var m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2,z=Math.min(320,m),cv=document.createElement('canvas');
        cv.width=z;cv.height=z;cv.getContext('2d').drawImage(im,sx,sy,m,m,0,0,z,z);
        cv.toBlob(function(b){b?res(b):rej(new Error('blob'));},'image/jpeg',0.82);
      };
      im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
      im.src=url;
    });
  }

    });
  }else if(S.sess){
    loadProfile().catch(function(){S.profReady=false;S.profFail=!!S.sess;}).then(function(){if(S.view==='me'||S.view==='sell'||S.view==='detail'){var l=getListing(S.pid);if(S.view==='detail'&&l&&S.sess&&S.sess.uid!==l.seller_id)ensurePhone(l.seller_id);render();}});
  }
})();
</script>
</body>
